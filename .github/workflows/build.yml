name: Build System Daemon Binaries

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. BUILD CPU DAEMON (Ubuntu 22.04 with AVX2/BMI2 & AVX-512 IFMA)
  build-cpu-linux:
    name: Build CPU Daemon (Linux x86_64 - JeanLucPons Core)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure JeanLucPons/Kangaroo core files are present
        run: |
          if [ ! -d "SECPK1" ] || [ ! -f "Timer.cpp" ] || [ ! -f "Constants.h" ]; then
            git clone --depth 1 https://github.com/JeanLucPons/Kangaroo.git /tmp/upstream_kangaroo
            cp -rf /tmp/upstream_kangaroo/SECPK1 .
            cp -rf /tmp/upstream_kangaroo/GPU .
            cp -f /tmp/upstream_kangaroo/Timer.h /tmp/upstream_kangaroo/Timer.cpp .
            cp -f /tmp/upstream_kangaroo/Constants.h .
            rm -rf /tmp/upstream_kangaroo
          fi
      - name: Install build tools & libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev
      - name: Compile CPU Daemon (AVX2 Baseline & AVX-512 IFMA High-Performance)
        run: |
          mkdir -p bin
          g++ -std=c++17 -O3 -flto -fno-plt -mavx2 -mbmi2 -madx -Wno-write-strings \
            sysd.cpp \
            SECPK1/SECP256K1.cpp \
            SECPK1/Point.cpp \
            SECPK1/Int.cpp \
            SECPK1/IntGroup.cpp \
            SECPK1/IntMod.cpp \
            SECPK1/Random.cpp \
            Timer.cpp \
            -o bin/sysd_linux_cpu_x86_64 \
            -lcurl -lpthread -static-libgcc -static-libstdc++
          strip bin/sysd_linux_cpu_x86_64
          chmod +x bin/sysd_linux_cpu_x86_64

          g++ -std=c++17 -O3 -flto -fno-plt -mavx512f -mavx512dq -mavx512bw -mavx512vl -mbmi2 -madx -Wno-write-strings \
            sysd.cpp \
            SECPK1/SECP256K1.cpp \
            SECPK1/Point.cpp \
            SECPK1/Int.cpp \
            SECPK1/IntGroup.cpp \
            SECPK1/IntMod.cpp \
            SECPK1/Random.cpp \
            Timer.cpp \
            -o bin/sysd_linux_cpu_avx512 \
            -lcurl -lpthread -static-libgcc -static-libstdc++
          strip bin/sysd_linux_cpu_avx512
          chmod +x bin/sysd_linux_cpu_avx512
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_linux_cpu_x86_64
          path: bin/sysd_linux_cpu_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_linux_cpu_avx512
          path: bin/sysd_linux_cpu_avx512

  # 2. BUILD NVIDIA CUDA GPU DAEMON (SM 60-90)
  build-cuda-linux:
    name: Build CUDA GPU Daemon (NVIDIA SM 60-90 - JeanLucPons GPUEngine)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure JeanLucPons/Kangaroo core files are present
        run: |
          if [ ! -d "SECPK1" ] || [ ! -d "GPU" ] || [ ! -f "Timer.cpp" ] || [ ! -f "Constants.h" ]; then
            git clone --depth 1 https://github.com/JeanLucPons/Kangaroo.git /tmp/upstream_kangaroo
            cp -rf /tmp/upstream_kangaroo/SECPK1 .
            cp -rf /tmp/upstream_kangaroo/GPU .
            cp -f /tmp/upstream_kangaroo/Timer.h /tmp/upstream_kangaroo/Timer.cpp .
            cp -f /tmp/upstream_kangaroo/Constants.h .
            sed -i 's/#define NB_RUN 64/#define NB_RUN 2048/g' Constants.h
            sed -i 's/inputKangarooPinned\[t + 10 \* nbThreadPerGroup\]/inputKangarooPinned[g * strideSize + t + 10 * nbThreadPerGroup]/g' GPU/GPUEngine.cu
            cat << 'PYEOF' > patch_respawn.py
with open("GPU/GPUEngine.h", "r") as f:
    h = f.read()
decl = '''
typedef struct {
  uint64_t kIdx;
  Int px;
  Int py;
  Int d;
} KangarooRespawnItem;
'''
if "KangarooRespawnItem" not in h:
    h = h.replace("typedef struct {", decl + "\ntypedef struct {", 1)
    h = h.replace("void SetKangaroo(uint64_t kIdx,Int *px,Int *py,Int *d);", "void SetKangaroo(uint64_t kIdx,Int *px,Int *py,Int *d);\n  void SetKangaroosBatch(const KangarooRespawnItem *items, size_t count);")
    with open("GPU/GPUEngine.h", "w") as f:
        f.write(h)

with open("GPU/GPUEngine.cu", "r") as f:
    cu = f.read()

batch_func = '''
__global__ void _SetKangaroosBatchKernel(const KangarooRespawnItem *items, size_t count, uint64_t *inputKangaroo, int nbThreadPerGroup, int gSize, int strideSize, int blockSize, Int wildOffset) {
    size_t i = (size_t)blockIdx.x * (size_t)blockDim.x + (size_t)threadIdx.x;
    if (i >= count) return;
    KangarooRespawnItem item = items[i];
    uint64_t kIdx = item.kIdx;
    uint64_t t = kIdx % nbThreadPerGroup;
    uint64_t g = (kIdx / nbThreadPerGroup) % GPU_GRP_SIZE;
    uint64_t b = kIdx / (nbThreadPerGroup * GPU_GRP_SIZE);
    uint64_t baseOffset = b * blockSize + g * strideSize + t;
    inputKangaroo[baseOffset + 0 * nbThreadPerGroup] = item.px.bits64[0];
    inputKangaroo[baseOffset + 1 * nbThreadPerGroup] = item.px.bits64[1];
    inputKangaroo[baseOffset + 2 * nbThreadPerGroup] = item.px.bits64[2];
    inputKangaroo[baseOffset + 3 * nbThreadPerGroup] = item.px.bits64[3];
    inputKangaroo[baseOffset + 4 * nbThreadPerGroup] = item.py.bits64[0];
    inputKangaroo[baseOffset + 5 * nbThreadPerGroup] = item.py.bits64[1];
    inputKangaroo[baseOffset + 6 * nbThreadPerGroup] = item.py.bits64[2];
    inputKangaroo[baseOffset + 7 * nbThreadPerGroup] = item.py.bits64[3];
    Int dOff = item.d;
    if (kIdx % 2 == WILD) dOff.ModAddK1order(&wildOffset);
    inputKangaroo[baseOffset + 8 * nbThreadPerGroup] = dOff.bits64[0];
    inputKangaroo[baseOffset + 9 * nbThreadPerGroup] = dOff.bits64[1];
#ifdef USE_SYMMETRY
    inputKangaroo[baseOffset + 10 * nbThreadPerGroup] = (uint64_t)NB_JUMP;
#endif
}

void GPUEngine::SetKangaroosBatch(const KangarooRespawnItem *items, size_t count) {
    if (count == 0 || items == nullptr) return;
    KangarooRespawnItem *d_items = nullptr;
    size_t bytes = count * sizeof(KangarooRespawnItem);
    cudaError_t err = cudaMalloc(&d_items, bytes);
    if (err != cudaSuccess || d_items == nullptr) {
        for (size_t i = 0; i < count; ++i) {
            SetKangaroo(items[i].kIdx, (Int*)&items[i].px, (Int*)&items[i].py, (Int*)&items[i].d);
        }
        return;
    }
    cudaMemcpy(d_items, items, bytes, cudaMemcpyHostToDevice);
    int gSize = KSIZE * GPU_GRP_SIZE;
    int strideSize = nbThreadPerGroup * KSIZE;
    int blockSize = nbThreadPerGroup * gSize;
    int threads = 256;
    int blocks = (int)((count + threads - 1) / threads);
    _SetKangaroosBatchKernel<<<blocks, threads>>>(d_items, count, inputKangaroo, nbThreadPerGroup, gSize, strideSize, blockSize, wildOffset);
    cudaDeviceSynchronize();
    cudaFree(d_items);
}
'''
if "SetKangaroosBatch" not in cu:
    cu += batch_func
    with open("GPU/GPUEngine.cu", "w") as f:
        f.write(cu)
PYEOF
            python3 patch_respawn.py && rm -f patch_respawn.py
            rm -rf /tmp/upstream_kangaroo
          fi
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev", "driver-dev"]'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev
      - name: Compile CUDA GPU Daemon
        run: |
          mkdir -p bin
          nvcc -std=c++17 -O3 -DUSE_CUDA -Xcompiler -Wno-write-strings -Xptxas -O3 \
            sysd.cpp \
            SECPK1/SECP256K1.cpp \
            SECPK1/Point.cpp \
            SECPK1/Int.cpp \
            SECPK1/IntGroup.cpp \
            SECPK1/IntMod.cpp \
            SECPK1/Random.cpp \
            Timer.cpp \
            GPU/GPUEngine.cu \
            -o bin/sysd_linux_gpu_cuda \
            -lcurl -lpthread \
            -gencode arch=compute_60,code=sm_60 \
            -gencode arch=compute_61,code=sm_61 \
            -gencode arch=compute_70,code=sm_70 \
            -gencode arch=compute_75,code=sm_75 \
            -gencode arch=compute_80,code=sm_80 \
            -gencode arch=compute_86,code=sm_86 \
            -gencode arch=compute_89,code=sm_89 \
            -gencode arch=compute_90,code=sm_90 \
            -gencode arch=compute_90,code=compute_90
          strip bin/sysd_linux_gpu_cuda
          chmod +x bin/sysd_linux_gpu_cuda
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_linux_gpu_cuda
          path: bin/sysd_linux_gpu_cuda

  # 3. BUILD MACOS DAEMON
  build-macos:
    name: Build macOS Daemon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure JeanLucPons/Kangaroo core files are present
        run: |
          if [ ! -d "SECPK1" ] || [ ! -f "Timer.cpp" ] || [ ! -f "Constants.h" ]; then
            git clone --depth 1 https://github.com/JeanLucPons/Kangaroo.git /tmp/upstream_kangaroo
            cp -rf /tmp/upstream_kangaroo/SECPK1 .
            cp -rf /tmp/upstream_kangaroo/GPU .
            cp -f /tmp/upstream_kangaroo/Timer.h /tmp/upstream_kangaroo/Timer.cpp .
            cp -f /tmp/upstream_kangaroo/Constants.h .
            rm -rf /tmp/upstream_kangaroo
          fi
      - name: Compile on macOS
        run: |
          mkdir -p bin
          clang++ -std=c++17 -O3 -flto -arch x86_64 -Wno-write-strings -Wno-deprecated-declarations -D__rdtsc=pons_rdtsc -D__builtin_ia32_sbb_u64=__builtin_ia32_subborrow_u64 \
            sysd.cpp \
            SECPK1/SECP256K1.cpp \
            SECPK1/Point.cpp \
            SECPK1/Int.cpp \
            SECPK1/IntGroup.cpp \
            SECPK1/IntMod.cpp \
            SECPK1/Random.cpp \
            Timer.cpp \
            -o bin/sysd_darwin_all \
            -lcurl -lpthread
          strip bin/sysd_darwin_all
          chmod +x bin/sysd_darwin_all
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_darwin_all
          path: bin/sysd_darwin_all

  # 4. COMMIT PREBUILT BINARIES TO BRANCH
  commit-to-branch:
    name: Commit Binaries to Current Branch
    needs: [build-cpu-linux, build-cuda-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sysd_linux_cpu_x86_64
          path: /tmp/built_bins/
      - uses: actions/download-artifact@v4
        with:
          name: sysd_linux_cpu_avx512
          path: /tmp/built_bins/
      - uses: actions/download-artifact@v4
        with:
          name: sysd_linux_gpu_cuda
          path: /tmp/built_bins/
      - uses: actions/download-artifact@v4
        with:
          name: sysd_darwin_all
          path: /tmp/built_bins/
      - name: Commit and push binaries to branch
        run: |
          test -s /tmp/built_bins/sysd_linux_cpu_x86_64
          test -s /tmp/built_bins/sysd_linux_cpu_avx512
          test -s /tmp/built_bins/sysd_linux_gpu_cuda
          test -s /tmp/built_bins/sysd_darwin_all
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          mkdir -p bin
          cp -f /tmp/built_bins/sysd_linux_cpu_x86_64 bin/sysd_linux_cpu_x86_64
          cp -f /tmp/built_bins/sysd_linux_cpu_avx512 bin/sysd_linux_cpu_avx512
          cp -f /tmp/built_bins/sysd_linux_gpu_cuda bin/sysd_linux_gpu_cuda
          cp -f /tmp/built_bins/sysd_darwin_all bin/sysd_darwin_all
          chmod +x bin/sysd_linux_cpu_x86_64 bin/sysd_linux_cpu_avx512 bin/sysd_linux_gpu_cuda bin/sysd_darwin_all
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bin/sysd_linux_cpu_x86_64 bin/sysd_linux_cpu_avx512 bin/sysd_linux_gpu_cuda bin/sysd_darwin_all
          if ! git diff --cached --quiet -- bin/; then
            git commit -m "build: compile sysd binaries [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No staged binary changes to commit"
          fi
