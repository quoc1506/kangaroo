name: Build System Daemon Binaries & Commit to Branch

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. BUILD NATIVE CPU DAEMON (Linux x86_64 AVX2)
  build-cpu-linux:
    name: Build Native CPU Daemon (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools & libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev
      - name: Compile Native C++ CPU Daemon
        run: |
          mkdir -p bin
          g++ -O3 -std=c++17 -march=x86-64-v3 -mavx2 -pthread             sysd.cpp             -o bin/sysd_linux_cpu_x86_64             -lcurl -lssl -lcrypto -lpthread -ldl
          strip --strip-all bin/sysd_linux_cpu_x86_64
          chmod +x bin/sysd_linux_cpu_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_linux_cpu_x86_64
          path: bin/sysd_linux_cpu_x86_64

  # 2. BUILD REAL CUDA GPU DAEMON (NVIDIA SM 60-90)
  build-cuda-linux:
    name: Build CUDA GPU Daemon (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev", "driver-dev"]'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev
      - name: Compile CUDA GPU Daemon
        run: |
          mkdir -p bin
          nvcc -O3 -std=c++17 -DUSE_CUDA -x cu             -gencode arch=compute_60,code=sm_60             -gencode arch=compute_70,code=sm_70             -gencode arch=compute_75,code=sm_75             -gencode arch=compute_80,code=sm_80             -gencode arch=compute_86,code=sm_86             -gencode arch=compute_89,code=sm_89             -gencode arch=compute_90,code=sm_90             -Xcompiler "-O3 -march=x86-64 -fPIC"             sysd.cpp             -o bin/sysd_linux_gpu_cuda             -lcurl -lssl -lcrypto -lpthread -ldl
          strip --strip-all bin/sysd_linux_gpu_cuda
          chmod +x bin/sysd_linux_gpu_cuda
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_linux_gpu_cuda
          path: bin/sysd_linux_gpu_cuda

  # 3. BUILD MACOS UNIVERSAL DAEMON
  build-macos:
    name: Build macOS Universal Daemon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile macOS Universal Daemon
        run: |
          mkdir -p bin
          clang++ -O3 -std=c++17 -arch arm64 -arch x86_64             sysd.cpp             -o bin/sysd_darwin_all             -lcurl -lpthread
          strip bin/sysd_darwin_all
          chmod +x bin/sysd_darwin_all
      - uses: actions/upload-artifact@v4
        with:
          name: sysd_darwin_all
          path: bin/sysd_darwin_all

  # 4. COMMIT PREBUILT BINARIES DIRECTLY TO BRANCH
  commit-to-branch:
    name: Commit Binaries to Current Branch
    needs: [build-cpu-linux, build-cuda-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sysd_linux_cpu_x86_64
          path: bin/
      - uses: actions/download-artifact@v4
        with:
          name: sysd_linux_gpu_cuda
          path: bin/
      - uses: actions/download-artifact@v4
        with:
          name: sysd_darwin_all
          path: bin/
      - name: Commit and push binaries to branch
        run: |
          chmod +x bin/*
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bin/sysd_linux_cpu_x86_64 bin/sysd_linux_gpu_cuda bin/sysd_darwin_all
          git commit -m "auto: update compiled binaries [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
